name: kijumbe_app
description: "App for handling Member Group Contributions Games (Fintech)"
publish_to: 'none' 

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  path: ^1.9.1
  icons_plus: ^5.0.0
  image_picker: ^1.2.2
  video_player: ^2.10.1
  flutter_slidable: ^4.0.3
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  get: 
  intl_phone_field: ^3.2.0
  google_maps: ^8.3.0
  google_maps_flutter: ^2.14.2
  geolocator: 14.0.2
  map_location_picker: ^3.1.0
  smooth_page_indicator: ^3.0.0
  page_view_dot_indicator: ^2.3.0
  flutter_svg: ^2.3.0
  package_info_plus: ^9.0.1
  flutter_localization: ^0.4.1
  device_info_plus: ^12.4.0
  internet_connection_checker_plus: ^3.1.2
  internet_connection_checker: ^3.0.1
  lottie: ^3.3.0
  pinput: ^6.0.2
  google_nav_bar: ^5.0.7

  flutter_localizations:
    sdk: flutter
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  ionicons: ^0.2.2
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_launcher_icon_foreground.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/fonts/inter/
    - assets/fonts/sfPro/
    - assets/svgs/
    - assets/icons/

  fonts:
    - family: SfProDisplay
      fonts:
        - asset: assets/fonts/sfPro/SFPRODISPLAYREGULAR.otf
        - asset: assets/fonts/sfPro/SFPRODISPLAYMEDIUM.otf
          weight: 500
        - asset: assets/fonts/sfPro/SFPRODISPLAYBOLD.otf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_28pt-Regular.ttf
        - asset: assets/fonts/inter/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_28pt-Bold.ttf
          weight: 700
